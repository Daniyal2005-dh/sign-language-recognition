name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Unit tests exercise the pure-NumPy core (features, rules, smoothing);
      # MediaPipe/TensorFlow are intentionally not installed to keep CI fast.
      - name: Install test dependencies
        run: pip install numpy pytest

      - name: Run unit tests
        run: pytest -q

      - name: Syntax-check every entry point
        run: python -m compileall -q app.py train.py collect_data.py real_time_demo.py scripts src
